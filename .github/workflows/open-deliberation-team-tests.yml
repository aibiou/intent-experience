name: Open Deliberation Team tests

on:
  push:
    branches: ["open-deliberation-team"]
    paths:
      - "tools/open-deliberation-team/**"
      - ".github/workflows/open-deliberation-team-tests.yml"
  pull_request:
    paths:
      - "tools/open-deliberation-team/**"
      - ".github/workflows/open-deliberation-team-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/open-deliberation-team
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic tests
        run: python -m pytest -q
